
name: Build Crinmison PSP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair arquivos do jogo
        run: unzip -o Crinmison_PSP_Base.zip -d .

      - name: Compilar jogo
        run: make

      - name: Salvar jogo e sprites
        uses: actions/upload-artifact@v4
        with:
          name: Crinmison-PSP
          path: |
            EBOOT.PBP
            assets/sprites/
